services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openpoke_test
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openpoke_test"]
      interval: 1s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
