name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: 0.8.0
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q -m "not postgres"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openpoke_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openpoke_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 20
    env:
      OPENPOKE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/openpoke_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: 0.8.0
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q -m postgres

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run build --prefix web

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --tag openpoke-backend:ci .
      - run: docker run --rm --entrypoint sh openpoke-backend:ci -c 'test "$(id -u)" = 10001'
      - run: docker run --rm openpoke-backend:ci -m server.server --help
      - run: docker run --rm openpoke-backend:ci -m server.worker --help
      - run: docker run --rm openpoke-backend:ci -m server.migrate --help
